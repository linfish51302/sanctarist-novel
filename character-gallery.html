<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色形象專欄 - 聖術師：失落的繼承者</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 角色形象專欄專屬高質感奇幻排版 */
        .gallery-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .gallery-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .gallery-header h2 {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            color: var(--gold-accent);
            letter-spacing: 0.15em;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        .gallery-header p {
            color: #a39b8b;
            font-size: 1rem;
            letter-spacing: 0.2em;
        }

        /* 網格排列：史詩畫廊感 */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 40px;
            margin-bottom: 60px;
        }

        .gallery-card {
            background: rgba(18, 18, 18, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.35);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
            transition: all 0.4s ease;
            display: flex;
            flex-direction: column;
        }

        .gallery-card:hover {
            border-color: rgba(212, 175, 55, 0.9);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
            transform: translateY(-6px);
        }

        .gallery-img-box {
            width: 100%;
            height: 400px;
            overflow: hidden;
            position: relative;
        }

        .gallery-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: sepia(10%) contrast(105%);
            transition: transform 0.5s ease, filter 0.5s ease;
        }

        .gallery-card:hover .gallery-img-box img {
            transform: scale(1.04);
            filter: sepia(0%) contrast(110%);
        }

        .gallery-caption {
            padding: 25px 20px;
            text-align: center;
            background: linear-gradient(to bottom, rgba(18,18,18,0.6), rgba(10,10,10,0.95));
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .gallery-caption h3 {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            color: var(--gold-accent);
            margin-bottom: 8px;
            letter-spacing: 0.1em;
        }

        .gallery-caption .char-title {
            font-size: 0.85rem;
            color: #a39b8b;
            letter-spacing: 0.15em;
        }
    </style>
</head>
<body>

    <!-- 魔法漂浮光點背景 -->
    <div class="magic-particles"></div>

    <div class="book-container gallery-container">
        <!-- 頂部 Logo -->
        <div style="text-align: center; margin-bottom: 30px;">
            <a href="index.html">
                <img src="whitemagic-logo.png" alt="白魔法藝術工作室 Logo" style="max-width: 110px; height: auto; filter: drop-shadow(0 0 10px rgba(212,175,55,0.6)); opacity: 0.95;">
            </a>
            <p style="font-family: 'Cinzel', serif; color: var(--gold-accent); letter-spacing: 0.35em; font-size: 0.75rem; opacity: 0.75; margin-top: 8px;">WHITE MAGIC ART STUDIO</p>
        </div>

        <!-- 專欄標題 -->
        <div class="gallery-header">
            <h2>角色形象專欄</h2>
            <p>THE SANCTARIST CHARACTER GALLERY</p>
        </div>

        <!-- 角色海報網格 -->
        <div class="gallery-grid">
            <!-- 1. 柴克・安德烈 -->
            <div class="gallery-card">
                <div class="gallery-img-box">
                    <img src="zack.png" alt="柴克・安德烈">
                </div>
                <div class="gallery-caption">
                    <h3>柴克・安德烈</h3>
                    <div class="char-title">ZACK ANDRE</div>
                </div>
            </div>

            <!-- 2. 克里斯・安德烈 -->
            <div class="gallery-card">
                <div class="gallery-img-box">
                    <img src="chris.png" alt="克里斯・安德烈">
                </div>
                <div class="gallery-caption">
                    <h3>克里斯・安德烈</h3>
                    <div class="char-title">CHRIS ANDRE</div>
                </div>
            </div>

            <!-- 3. 安娜・安德烈 -->
            <div class="gallery-card">
                <div class="gallery-img-box">
                    <img src="anna.png" alt="安娜・安德烈">
                </div>
                <div class="gallery-caption">
                    <h3>安娜・安德烈</h3>
                    <div class="char-title">ANNA ANDRE</div>
                </div>
            </div>

            <!-- 4. 雷・安德烈 -->
            <div class="gallery-card">
                <div class="gallery-img-box">
                    <img src="ray.png" alt="雷・安德烈">
                </div>
                <div class="gallery-caption">
                    <h3>雷・安德烈</h3>
                    <div class="char-title">RAY ANDRE</div>
                </div>
            </div>

            <!-- 5. 傑西・約爾森 -->
            <div class="gallery-card">
                <div class="gallery-img-box">
                    <img src="jesse.png" alt="傑西・約爾森">
                </div>
                <div class="gallery-caption">
                    <h3>傑西・約爾森</h3>
                    <div class="char-title">JESSE JORGENSEN</div>
                </div>
            </div>

            <!-- 6. 鮑勃？ -->
            <div class="gallery-card">
                <div class="gallery-img-box">
                    <img src="bob.png" alt="鮑勃？">
                </div>
                <div class="gallery-caption">
                    <h3>鮑勃？</h3>
                    <div class="char-title">BOB?</div>
                </div>
            </div>
        </div>

        <!-- 底部返回導覽 -->
        <div class="nav-footer" style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(212, 175, 55, 0.2); padding-top: 25px;">
            <a href="index.html" class="magical-btn" style="padding: 10px 20px; font-size: 0.85rem;">← 返回首頁</a>
            <a href="toc.html" class="magical-btn" style="padding: 10px 20px; font-size: 0.85rem;">前往目錄 📖</a>
        </div>
    </div>

</body>
</html>
