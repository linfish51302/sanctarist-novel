<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聖術師 - 失落的繼承者 | 官方小說網站</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 書本容器 (.book-container) 設定：以 cover2.png 作為精裝書封面底圖 */
        .book-container {
            background: linear-gradient(135deg, rgba(18, 18, 18, 0.75), rgba(10, 10, 10, 0.85)), 
                        url('cover2.png') no-repeat center center;
            background-size: cover;
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(212, 175, 55, 0.15);
            padding: 40px 30px;
            max-width: 800px;
            margin: 40px auto;
            position: relative;
            text-align: center;
        }

        /* 上方工作室 Logo 區塊 */
        .studio-logo-box {
            margin-bottom: 18px;
        }

        /* 解法一：將大標題 Logo 上移至頂部，完全避開主角臉部 */
        .main-title-box {
            margin: 0 auto 25px auto;
        }
        .main-title-box img {
            max-width: 480px;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 0 25px rgba(212,175,55,0.8));
        }

        /* 史詩級小說簡介文字 */
        .novel-intro {
            max-width: 540px;
            margin: 0 auto 30px auto;
            font-size: 0.95rem;
            color: #f0e6d2;
            opacity: 0.95;
            line-height: 2.1;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
            text-align: justify;
        }

        /* 導覽專區精緻質感樣式 */
        .nav-section {
            text-align: center;
            position: relative;
            z-index: 2;
            max-width: 400px;
            margin: 0 auto;
        }
        .nav-title {
            font-family: 'Cinzel', serif;
            color: var(--gold-accent);
            font-size: 0.9rem;
            letter-spacing: 0.3em;
            margin-bottom: 15px;
            opacity: 0.85;
            text-transform: uppercase;
        }
        .nav-links {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .nav-links li {
            margin-bottom: 12px;
        }
        .nav-links a {
            display: inline-block;
            color: #d8cebc;
            text-decoration: none;
            font-size: 1.05rem;
            letter-spacing: 0.2em;
            padding: 6px 20px;
            transition: all 0.3s ease;
            border-bottom: 1px solid transparent;
        }
        .nav-links a:hover {
            color: #ffe875;
            border-bottom: 1px solid rgba(212, 175, 55, 0.5);
            text-shadow: 0 0 10px rgba(255, 232, 117, 0.5);
            transform: translateY(-2px);
        }

        /* 優雅的細金線分隔線 */
        .ornament-line {
            width: 120px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.6), transparent);
            margin: 25px auto;
        }
    </style>
</head>
<body>

    <!-- 魔法漂浮光點背景 -->
    <div class="magic-particles"></div>

    <div class="book-container">
        <!-- 封面主內容 -->
        <div style="position: relative; z-index: 2;">
            
            <!-- 上方：白魔法工作室 Logo -->
            <div class="studio-logo-box">
                <img src="whitemagic-logo.png" alt="白魔法藝術工作室 Logo" style="max-width: 110px; height: auto; filter: drop-shadow(0 0 10px rgba(212,175,55,0.6)); opacity: 0.95;">
                <p style="font-family: 'Cinzel', serif; color: var(--gold-accent); letter-spacing: 0.35em; font-size: 0.75rem; opacity: 0.75; margin-top: 6px;">WHITE MAGIC ART STUDIO</p>
            </div>
            
            <!-- 正中央上方：書名 Logo (logo2.png) 調整至上方避開臉部 -->
            <div class="main-title-box">
                <img src="logo2.png" alt="聖術師 - 失落的繼承者">
            </div>

            <!-- 史詩級小說簡介文字（含呼吸閃動燙金字） -->
            <p class="novel-intro">
                當滾滾雷聲劃破夜空時，你可曾想過，那或許不是暴雨將至的預兆，而是ㄧ群隱密的人正在黑夜中為你與惡魔浴血奮戰？當滔天巨浪洶湧翻騰時，你可曾想過，那或許不是惡劣的天氣所致，而是他們正乘風破浪，為了守護這座世界而奔赴戰場？在他們之中，有人能憑藉意念撫平致命的傷口，有人能徒手移山倒海。他們從不公開現身，卻曾在歷史的陰影裡悄悄扭轉了無數文明的命運。其真實身份早已湮沒在歲月的塵埃中，唯有一個古老的稱呼流傳至今——<span class="gold-breathe">聖術師</span>。
            </p>
            
            <!-- 翻開序章按鈕 -->
            <a href="prologue.html" class="magical-btn">翻開序章：血祭封印</a>
        </div>

        <div class="ornament-line"></div>
        
        <!-- 質感導覽專區 -->
        <div class="nav-section">
            <div class="nav-title">Navigation</div>
            <ul class="nav-links">
                <li><a href="characters.html">主要人物介紹</a></li>
                <li><a href="character-gallery.html">角色形象專欄</a></li>
                <li><a href="toc.html">完整章節目錄</a></li>
            </ul>
        </div>
    </div>

</body>
</html>
