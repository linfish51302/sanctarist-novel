<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第八章：星雷 - 聖術師：失落的繼承者</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 閱讀頁面專屬排版優化 */
        .book-container {
            background: linear-gradient(135deg, rgba(18, 18, 18, 0.75), rgba(10, 10, 10, 0.85)), 
                        url('cover2.png') no-repeat center center;
            background-size: cover;
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(212, 175, 55, 0.15);
            padding: 40px 30px;
            max-width: 800px;
            margin: 40px auto;
            position: relative;
        }

        .novel-content {
            line-height: 2.2;
            font-size: 1.1rem;
            color: #d8cebc;
            text-align: justify;
        }

        .novel-content p {
            margin-bottom: 1.8em;
            text-indent: 2em;
        }

        /* 燙金色時間與地點樣式 */
        .novel-content p.scene-time-location {
            text-indent: 0;
            font-weight: bold;
            letter-spacing: 0.12em;
            background: linear-gradient(135deg, #ffe875 0%, #f3e5ab 45%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.45));
            margin-top: 2.4em;
            margin-bottom: 2em;
        }

        .novel-content p.scene-time-location:first-child {
            margin-top: 0;
        }

        /* --- 內文中段的高質感插圖樣式 --- */
        .chapter-illustration {
            max-width: 100%;
            margin: 40px auto;
            text-align: center;
            position: relative;
        }

        .chapter-illustration img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            border: 1px solid rgba(212, 175, 55, 0.4); /* 金屬微光邊框 */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(212, 175, 55, 0.15); /* 沉浸式陰影 */
            filter: sepia(8%) contrast(105%);
            transition: transform 0.4s ease, filter 0.4s ease;
        }

        .chapter-illustration img:hover {
            transform: scale(1.01);
            filter: sepia(0%) contrast(110%);
        }

        .illustration-caption {
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            color: var(--gold-accent);
            letter-spacing: 0.25em;
            margin-top: 12px;
            opacity: 0.75;
        }
    </style>
</head>
<body>

    <!-- 魔法漂浮光點背景 -->
    <div class="magic-particles"></div>

    <div class="book-container">
        <!-- 頂部：白魔法工作室 Logo（點擊可返回首頁） -->
        <div style="text-align: center; margin-bottom: 25px;">
            <a href="index.html">
                <img src="whitemagic-logo.png" alt="白魔法藝術工作室 Logo" style="max-width: 110px; height: auto; filter: drop-shadow(0 0 10px rgba(212,175,55,0.6)); opacity: 0.95;">
            </a>
            <p style="font-family: 'Cinzel', serif; color: var(--gold-accent); letter-spacing: 0.35em; font-size: 0.75rem; opacity: 0.75; margin-top: 8px;">WHITE MAGIC ART STUDIO</p>
        </div>

        <!-- 章節標題 -->
        <h2 style="font-size: 1.6rem; margin-bottom: 5px; text-align: center; letter-spacing: 0.1em;">第八章</h2>
        <h3 style="font-size: 1.3rem; margin-bottom: 40px; color: var(--gold-accent); text-align: center; letter-spacing: 0.15em;">星雷</h3>

        <!-- 小說內文區 -->
        <div class="novel-content">
            
            <p class="scene-time-location">美國・猶他州・鹽湖城・東湖地下教會，密室。</p
